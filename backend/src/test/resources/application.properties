spring.application.name=financeapp

# ==============================
# EMBEDDED DATABASE FOR TESTING
# ==============================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==============================
# JPA/HIBERNATE FOR TESTING
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==============================
# GOOGLE OAUTH2 CONFIGURATION
# ==============================
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# ==============================
# EMAIL SENDER CONFIGURATION
# ==============================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ==============================
# CLOUD BACKUP (AWS S3)
# ==============================
cloud.aws.enabled=false

# ==============================
# ADMIN CONFIGURATION
# ==============================
app.admin.email=admin@financeapp.com

# ==============================
# JWT CONFIGURATION
# ==============================
app.jwt-secret=test-secret-key-for-testing-purposes-only
app.jwt-expiration-ms=3600000
app.jwt.secret=test-secret-key-for-testing-purposes-only
app.jwt.expiration-ms=3600000

# ==============================
# EMAIL CONFIGURATION
# ==============================
spring.mail.from=test@test.com
app.mail.mock=true

# ==============================
# LOGGING
# ==============================
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
