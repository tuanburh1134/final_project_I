# Test Configuration
spring.application.name=financeapp-test
server.port=0

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
app.jwt-secret=test-secret-key-for-jwt-token-generation-in-test-environment
app.jwt-expiration-ms=86400000
app.jwt.secret=test-secret-key-for-jwt-token-generation-in-test-environment
app.jwt.expiration-ms=86400000

# Disable Email Sending in Tests
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=test
app.mail.mock=true

# Disable Google OAuth in Tests
app.google.client-id=test-client-id
mywallet.google.client-id=test-client-id
mywallet.google.client-secret=test-client-secret

# Disable reCAPTCHA in Tests
app.recaptcha.secret=test-recaptcha-secret

# Logging
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

