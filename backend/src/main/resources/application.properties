server.port=8080

# ========================
# DATABASE (MySQL)
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/mywallet?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# JWT CONFIG
# ========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ========================
# MAIL (Gmail demo)
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ========================
# GOOGLE OAUTH2 LOGIN
# ========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ========================
# SQL INIT (schema.sql + data.sql)
# ========================
spring.jpa.defer-datasource-initialization=true

# ========================
# GOOGLE ID TOKEN LOGIN
# ========================
mywallet.google.client-id=${GOOGLE_CLIENT_ID}
mywallet.google.client-secret=${GOOGLE_CLIENT_SECRET}

# ========================
# IMPORT SECRET FILE
# ========================
spring.config.import=classpath:application-secret.properties
